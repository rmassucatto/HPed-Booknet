<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17202a;--muted:#697586;--line:#dfe5eb;--primary:#1d4f73;--primary2:#12354f;--accent:#c69a49;--ok:#177245;--danger:#b42318;--shadow:0 12px 34px rgba(18,36,52,.10);--radius:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.centerPage{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 12%,#d6e6f2 0,transparent 34%),radial-gradient(circle at 90% 88%,#f3e5c7 0,transparent 32%),linear-gradient(160deg,#edf3f7,#f7f5ef)}
.loginCard{width:min(720px,calc(100vw - 32px));margin:auto;background:rgba(255,255,255,.96);border:1px solid #ffffffb8;border-radius:30px;padding:42px;box-shadow:0 26px 80px rgba(16,38,55,.16);text-align:center;overflow:hidden;position:relative}.loginCard:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--accent),#e4c77f,var(--primary))}.logoBig{width:92px;height:92px;border-radius:27px;margin:auto;background:linear-gradient(145deg,#12354f,#256388);display:grid;place-items:center;box-shadow:0 14px 30px rgba(18,53,79,.22)}.logoBig svg{width:62px;height:62px;display:block}.loginCard h1{font-size:36px;margin:22px 0 8px;letter-spacing:-.6px}.loginCard p{color:var(--muted);line-height:1.55;margin:0 auto 28px;max-width:570px}.loginActions{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bigChoice{padding:22px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfcfd);text-align:left;transition:.18s ease;min-height:132px}.bigChoice:hover{border-color:#95b2c7;box-shadow:0 10px 26px #16344e16;transform:translateY(-1px)}.choiceIcon{font-size:30px;display:block;margin-bottom:9px}.bigChoice b{font-size:17px}.bigChoice span{display:block;color:var(--muted);font-size:13px;margin-top:5px;line-height:1.4}.entryFoot{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.installEntry{display:inline-flex;align-items:center;gap:8px;border:1px solid #cbd7df;background:#f5f9fc;color:#174664;border-radius:999px;padding:9px 14px;font-weight:750}.installEntry:hover{background:#eaf3f8}.entryNote{width:100%;font-size:12px;color:#8a95a0;margin-top:2px}
.topbar{height:68px;background:linear-gradient(90deg,#102c42,#173e59);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 12px #0002;position:sticky;top:0;z-index:40}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.brandMark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--accent),#e4c77f);display:grid;place-items:center;color:#12283c;font-size:21px}.userBadge{font-size:13px;color:#dce6ef;display:flex;gap:10px;align-items:center}.shell{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 68px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px;overflow:auto}.sidebar h3{font-size:12px;text-transform:uppercase;color:#7a8795;letter-spacing:1.2px;margin:4px 8px 12px}.navItem{padding:11px 12px;border-radius:10px;margin-bottom:5px;cursor:pointer;font-weight:650;color:#344556}.navItem:hover,.navItem.active{background:#eaf1f7;color:#153b5c}.main{padding:26px;min-width:0}.pageHead{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.pageHead h2{margin:0;font-size:27px}.pageHead p{margin:5px 0 0;color:var(--muted)}
.card{background:#fff;border:1px solid #e6ebef;border-radius:var(--radius);box-shadow:0 5px 20px rgba(15,31,47,.05);padding:22px;margin-bottom:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700;background:var(--primary);color:#fff}.btn:hover{filter:brightness(.97)}.btn.secondary{background:#e9eef4;color:#1d3b56}.btn.ghost{background:transparent;border:1px solid #ffffff44;color:#fff}.btn.danger{background:#fff0ee;color:var(--danger);border:1px solid #ffd2cc}.btn.ok{background:var(--ok)}.btn.small{padding:7px 10px;font-size:12px;border-radius:9px}label{display:block;font-size:12px;font-weight:800;color:#506070;margin:0 0 7px;text-transform:uppercase;letter-spacing:.35px}input[type=text],input[type=password],input[type=url],select,textarea{width:100%;border:1px solid #cfd7df;border-radius:11px;padding:11px 12px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#6d9abe;box-shadow:0 0 0 3px #6d9abe22}.listTable{width:100%;border-collapse:collapse}.listTable th,.listTable td{text-align:left;padding:11px;border-bottom:1px solid #edf0f3;font-size:14px}.listTable th{font-size:11px;color:#758290;text-transform:uppercase}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eaf1f7;color:#315878;font-size:11px;font-weight:800}.empty{padding:55px 20px;text-align:center;color:#7c8995}.status{position:fixed;right:18px;bottom:18px;z-index:200;max-width:430px;padding:12px 15px;border-radius:12px;background:#173b5d;color:#fff;box-shadow:var(--shadow);font-size:13px}.status.err{background:#9f2c22}.status.ok{background:#177245}.modalBack{position:fixed;inset:0;background:#0c1d2bdd;display:grid;place-items:center;z-index:100;padding:20px}.modal{width:min(480px,96vw);background:#fff;border-radius:20px;padding:25px;box-shadow:0 30px 80px #0007}.modal h3{margin:0 0 6px}.modal p{color:var(--muted);font-size:14px}
.editorToolbar{display:flex;flex-wrap:wrap;gap:5px;padding:8px;background:#eef2f6;border:1px solid #d7dee5;border-bottom:0;border-radius:12px 12px 0 0}.editorToolbar button,.editorToolbar select{width:auto;border:1px solid #d2dae2;background:#fff;border-radius:7px;padding:6px 9px;min-height:32px}.editor{min-height:180px;border:1px solid #cfd7df;background:#fff;border-radius:0 0 12px 12px;padding:16px;outline:none;line-height:1.65;overflow:auto}.editor:focus{border-color:#6d9abe}.linkRow{display:grid;grid-template-columns:145px 1.4fr 1.6fr auto;gap:9px;align-items:end;margin:10px 0;padding:12px;background:#f8fafb;border:1px solid #e4e9ee;border-radius:13px}.linkListAdmin{display:grid;gap:10px;margin-top:14px}.linkChip{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#f3f6f8;border-radius:11px;padding:11px}.linkChip small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:650px}
.bookHero{padding:32px 36px;background:linear-gradient(135deg,#173b5d,#2d648f);color:#fff;border-radius:22px;margin-bottom:22px}.bookHero small{color:#d4e1ec;text-transform:uppercase;letter-spacing:1px;font-weight:700}.bookHero h1{font-size:35px;margin:8px 0 0}.chapterText{font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.8;padding:28px 34px}.chapterText p{margin:0 0 14px}.chapterText h2,.chapterText h3{margin:20px 0 10px}.chapterText ul,.chapterText ol{margin:8px 0 16px 24px}.resourceCard{display:flex;gap:15px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 5px 18px rgba(15,31,47,.05)}.resourceCard:hover{border-color:#91afc5;transform:translateY(-1px)}.resourceIcon{width:48px;height:48px;border-radius:14px;background:#eaf1f7;display:grid;place-items:center;font-size:24px;flex:0 0 auto}.resourceBody{min-width:0;flex:1}.resourceBody b{font-size:16px}.resourceBody p{margin:5px 0 0;color:var(--muted);font-size:13px}.resourceUrl{font-size:11px;color:#7c8995;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.readerWrap{max-width:980px;margin:auto}.themeCard{cursor:pointer;position:relative;overflow:hidden}.themeCard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}.themeTitleRow{display:flex;align-items:center;gap:14px;margin-bottom:10px}.themeBookIcon{font-size:34px;line-height:1;flex:0 0 auto}.themeTitleRow h3{margin:0;line-height:1.15}.themeCard p{margin:6px 0 14px}
.searchBox{display:flex;gap:9px;margin-bottom:18px}.searchBox input{flex:1}.kbd{font-size:11px;padding:3px 7px;border:1px solid #d6dde3;border-bottom-width:2px;border-radius:6px;background:#fff;color:#5f6b76}
@media(max-width:850px){.centerPage{padding:14px;place-items:center}.loginCard{width:100%;max-width:640px;padding:30px 22px;margin:auto}.loginCard h1{font-size:34px}.loginCard p{font-size:17px}.logoBig{width:88px;height:88px}.bigChoice{min-height:0;padding:20px}.entryFoot{margin-top:16px}.loginActions,.grid2,.grid3{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);max-height:275px}.main{padding:15px}.topbar{padding:0 13px}.linkRow{grid-template-columns:1fr}.bookHero{padding:24px}.bookHero h1{font-size:28px}.chapterText{padding:20px;font-size:17px}.pageHead{align-items:flex-start;flex-direction:column}}

.extCard{border:1px solid #cfe0eb;background:linear-gradient(180deg,#f8fcff,#fff);border-radius:18px;padding:20px;margin-bottom:18px}.extRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.extUrl{font-size:12px;color:var(--muted);word-break:break-all;background:#f5f7f9;padding:10px;border-radius:10px}.extBadge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#eaf4fb;color:#174664;font-size:12px;font-weight:800}.extActions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}@media(max-width:850px){.extRow{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="entry" class="centerPage"><div class="loginCard"><div class="logoBig"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="11" y="36" width="42" height="9" rx="3" fill="#75a6c7"/><rect x="14" y="27" width="38" height="10" rx="3" fill="#77b55a"/><rect x="10" y="18" width="41" height="10" rx="3" fill="#d84545"/><path d="M14 18l18-8 21 7-19 8z" fill="#f4d36b"/><path d="M16 20v8M49 19v8" stroke="#fff" stroke-width="2" opacity=".8"/><path d="M16 31h30M15 40h33" stroke="#fff" stroke-width="2" opacity=".75"/></svg></div><h1>HPed Booknet</h1><p>Monte sua própria biblioteca em forma de livro usando artigos, páginas e PDFs da internet, organizados por temas e capítulos.</p><div class="loginActions"><button class="bigChoice" id="btnReader"><span class="choiceIcon">📖</span><b>LEITOR</b><span>Ler os livros, capítulos e abrir as fontes catalogadas</span></button><button class="bigChoice" id="btnEditor"><span class="choiceIcon">✍️</span><b>EDITOR</b><span>Criar temas, capítulos, textos e links</span></button></div><div class="entryFoot"><button class="installEntry" id="btnInstallEntry" type="button">⬇️ Instalar HPed Booknet</button><div class="entryNote">Conteúdo salvo neste navegador • Backup e restauração em JSON</div></div></div></section>
<div id="passwordModal" class="modalBack hidden"><div class="modal"><h3>Entrar como Editor</h3><p>Digite a senha para editar o HPed Booknet.</p><label>Senha</label><input id="editorPass" type="password" autocomplete="current-password"><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button class="btn secondary" id="cancelPass">Cancelar</button><button class="btn" id="confirmPass">Entrar</button></div></div></div>
<section id="app" class="hidden"><header class="topbar"><div class="brand"><div class="brandMark">📚</div><span>HPed Booknet</span></div><div class="userBadge"><button class="btn ghost small hidden" id="btnInstallTop" type="button">⬇ Instalar</button><span id="modeBadge"></span><button class="btn ghost small" id="btnExit">Sair</button></div></header><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main" id="main"></main></div></section><div id="toast" class="status hidden"></div>
<script>
const EDITOR_PASSWORD="43114bk";
const EDITOR_SESSION_KEY="hped_booknet_editor_session";
const CAPTURE_QUEUE_KEY="hped_booknet_capture_queue";
const DB_NAME="hped_booknet_v1", STORE="booknet", DATA_KEY="libraryData";
let mode=null,themes=[],chapters=[],selectedTheme=null,selectedChapter=null,editingChapterId=null,draftLinks=[];
let deferredInstallPrompt=null;
function isStandalone(){return window.matchMedia?.('(display-mode: standalone)').matches || window.navigator.standalone===true}
function updateInstallButtons(){const installed=isStandalone();["btnInstallEntry","btnInstallTop"].forEach(id=>{const b=$(id);if(!b)return;b.classList.toggle("hidden",installed);});}
async function installBooknet(){
 if(isStandalone()){toast("HPed Booknet já está instalado.","ok");return;}
 if(deferredInstallPrompt){
  deferredInstallPrompt.prompt();
  try{await deferredInstallPrompt.userChoice}catch(e){}
  deferredInstallPrompt=null;updateInstallButtons();return;
 }
 if(location.protocol==="http:"||location.protocol==="https:"){toast("Se o botão do navegador não aparecer, use o menu ⋮ → Instalar app / Adicionar à tela inicial.");}
 else{toast("Para instalar como aplicativo, publique estes arquivos em HTTPS (por exemplo, Firebase). No arquivo local, use o menu do navegador se aparecer ‘Adicionar à tela inicial’.");}
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallButtons();});
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;updateInstallButtons();toast("HPed Booknet instalado.","ok")});

const $=id=>document.getElementById(id); const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8); const now=()=>Date.now();
function toast(msg,type=""){let t=$("toast");t.textContent=msg;t.className="status "+type;clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.add("hidden"),3200)}
function loadCaptureQueue(){try{return JSON.parse(localStorage.getItem(CAPTURE_QUEUE_KEY)||"[]")||[]}catch(e){return[]}}
function saveCaptureQueue(q){localStorage.setItem(CAPTURE_QUEUE_KEY,JSON.stringify(q||[]))}
function captureQueueCount(){return loadCaptureQueue().length}
function enqueueIncomingSource(){
 const x=incomingParams(); if(!x||!x.url)return false;
 let q=loadCaptureQueue();
 if(!q.some(i=>i.url===x.url)) q.push({id:uid(),url:x.url,title:x.title||x.url,type:x.type||"site",addedAt:now()});
 saveCaptureQueue(q); clearIncomingParams(); return true;
}
function removeCaptureFromQueue(id){saveCaptureQueue(loadCaptureQueue().filter(i=>i.id!==id));renderEditorSidebar();renderCaptureQueue()}
function clearCaptureQueue(){if(!confirm("Limpar todas as capturas pendentes?"))return;saveCaptureQueue([]);renderEditorSidebar();renderCaptureQueue();toast("Fila de capturas limpa.","ok")}

function idbOpen(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveAll(){sortData();localStorage.setItem(DATA_KEY,JSON.stringify({themes,chapters}));try{let db=await idbOpen();await new Promise((res,rej)=>{let tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put({themes,chapters,savedAt:now()},DATA_KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){console.warn(e)}}
async function loadAll(){try{let raw=localStorage.getItem(DATA_KEY);if(raw){let d=JSON.parse(raw);themes=Array.isArray(d.themes)?d.themes:[];chapters=Array.isArray(d.chapters)?d.chapters:[]}}catch(e){}try{let db=await idbOpen();let d=await new Promise((res,rej)=>{let tx=db.transaction(STORE,"readonly"),r=tx.objectStore(STORE).get(DATA_KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();if(d){themes=Array.isArray(d.themes)?d.themes:themes;chapters=Array.isArray(d.chapters)?d.chapters:chapters}}catch(e){}sortData()}
async function ensureDemo(){if(themes.length||chapters.length)return;const t1={id:"demo_hematologia",name:"HEMATOLOGIA",order:1,createdAt:now(),updatedAt:now()},t2={id:"demo_cardiologia",name:"CARDIOLOGIA",order:2,createdAt:now(),updatedAt:now()};themes=[t1,t2];chapters=[{id:"demo_anemia",themeId:t1.id,title:"Anemia Ferropriva",order:1,html:"<h2>Anemia Ferropriva</h2><p>Capítulo demonstrativo para organizar <strong>textos, artigos, diretrizes e PDFs</strong> sobre anemia ferropriva.</p><p>No Editor você pode substituir este texto e cadastrar várias fontes no mesmo capítulo.</p>",links:[{id:"demo_a1",type:"site",title:"OMS — Anaemia",url:"https://www.who.int/health-topics/anaemia"},{id:"demo_a2",type:"pdf",title:"OMS — Diretriz sobre ferritina e deficiência de ferro (PDF)",url:"https://iris.who.int/bitstream/handle/10665/331505/9789240000124-eng.pdf"}],createdAt:now(),updatedAt:now()},{id:"demo_infarto",themeId:t2.id,title:"Infarto do Miocárdio",order:1,html:"<h2>Infarto do Miocárdio</h2><p>Exemplo de capítulo do Booknet. Aqui você pode escrever uma introdução e reunir <strong>várias fontes</strong> sobre o mesmo assunto.</p>",links:[{id:"demo_i1",type:"site",title:"American Heart Association — What is a Heart Attack?",url:"https://www.heart.org/en/health-topics/heart-attack/about-heart-attacks"},{id:"demo_i2",type:"site",title:"American Heart Association — Heart Attack",url:"https://www.heart.org/en/health-topics/heart-attack"}],createdAt:now(),updatedAt:now()},{id:"demo_hipertensao",themeId:t2.id,title:"Hipertensão Arterial",order:2,html:"<h2>Hipertensão Arterial</h2><p>Segundo capítulo demonstrativo de Cardiologia, mostrando que um mesmo livro pode conter diversos capítulos.</p>",links:[{id:"demo_h1",type:"site",title:"OMS — Hypertension",url:"https://www.who.int/news-room/fact-sheets/detail/hypertension"}],createdAt:now(),updatedAt:now()}];await saveAll()}

async function fixDemoLinks(){
 const fixes={
  demo_a1:{type:"site",title:"OMS — Anaemia",url:"https://www.who.int/health-topics/anaemia"},
  demo_a2:{type:"pdf",title:"OMS — Diretriz sobre ferritina e deficiência de ferro (PDF)",url:"https://iris.who.int/bitstream/handle/10665/331505/9789240000124-eng.pdf"},
  demo_i1:{type:"site",title:"American Heart Association — What is a Heart Attack?",url:"https://www.heart.org/en/health-topics/heart-attack/about-heart-attacks"},
  demo_i2:{type:"site",title:"American Heart Association — Heart Attack",url:"https://www.heart.org/en/health-topics/heart-attack"},
  demo_h1:{type:"site",title:"OMS — Hypertension",url:"https://www.who.int/news-room/fact-sheets/detail/hypertension"}
 };
 let changed=false;
 chapters.forEach(c=>(c.links||[]).forEach(r=>{if(fixes[r.id]){Object.assign(r,fixes[r.id]);changed=true}}));
 if(changed)await saveAll();
}

function sortData(){themes.sort((a,b)=>(a.order??999)-(b.order??999)||a.name.localeCompare(b.name));chapters.sort((a,b)=>(a.order??999)-(b.order??999)||a.title.localeCompare(b.title))}
function setBooknetHistory(view,data={},replace=false){
 try{
  const st={hpedBooknet:true,mode:mode||"reader",view,...data};
  if(replace)history.replaceState(st,"",location.href);else history.pushState(st,"",location.href);
 }catch(e){console.warn("Histórico indisponível:",e)}
}
function showEntryFromHistory(){
 mode=null;selectedTheme=null;selectedChapter=null;
 $("app").classList.add("hidden");$("entry").classList.remove("hidden");
}
$("btnReader").onclick=async()=>{try{history.replaceState({hpedBooknet:true,view:"entry"},"",location.href)}catch(e){} mode="reader";await openApp();setBooknetHistory("library",{},false)};
$("btnEditor").onclick=()=>{$("passwordModal").classList.remove("hidden");$("editorPass").value="";setTimeout(()=>$("editorPass").focus(),50)};
$("cancelPass").onclick=()=>$("passwordModal").classList.add("hidden");
$("editorPass").onkeydown=e=>{if(e.key==="Enter")$("confirmPass").click()};
$("confirmPass").onclick=async()=>{if($("editorPass").value!==EDITOR_PASSWORD){toast("Senha incorreta.","err");return}try{sessionStorage.setItem(EDITOR_SESSION_KEY,"1")}catch(e){}try{history.replaceState({hpedBooknet:true,view:"entry"},"",location.href)}catch(e){} $("passwordModal").classList.add("hidden");mode="editor";await openApp();setBooknetHistory("editor",{},false)};
$("btnExit").onclick=()=>{try{sessionStorage.removeItem(EDITOR_SESSION_KEY)}catch(e){}showEntryFromHistory();try{history.replaceState({hpedBooknet:true,view:"entry"},"",location.href)}catch(e){}};
$("btnInstallEntry")?.addEventListener("click",installBooknet);
$("btnInstallTop")?.addEventListener("click",installBooknet);
updateInstallButtons();
if((location.protocol==="https:"||location.protocol==="http:") && "serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW:",e)));}

async function openApp(){await loadAll();await ensureDemo();await fixDemoLinks();$("entry").classList.add("hidden");$("app").classList.remove("hidden");$("modeBadge").textContent=mode==="editor"?"EDITOR":"LEITOR";if(mode==="editor"){if(hasIncomingSource())enqueueIncomingSource();renderEditorSidebar();if(captureQueueCount())renderCaptureQueue();else renderEditorHome()}else{renderReaderSidebar();renderReaderHome(false)}}
function renderEditorSidebar(){$("sidebar").innerHTML=`<h3>Editor</h3><div class="navItem active" onclick="renderEditorHome()">🏠 Visão geral</div><div class="navItem" onclick="renderThemesAdmin()">🗂️ Temas</div><div class="navItem" onclick="renderChaptersAdmin()">📄 Capítulos</div><div class="navItem" onclick="renderBackup()">💾 Backup / Restaurar</div><div class="navItem" onclick="renderCaptureQueue()">📥 Capturas pendentes <span style="float:right;background:#eaf1f7;color:#174664;padding:2px 7px;border-radius:999px;font-size:11px">${captureQueueCount()}</span></div><div class="navItem" onclick="renderBrowserIntegration()">🧩 Chrome / Edge</div><h3 style="margin-top:22px">Temas</h3>${themes.map(t=>`<div class="navItem" onclick="renderChaptersAdmin('${t.id}')">${esc(t.name)}</div>`).join("")||'<div style="padding:8px;color:#929ca6;font-size:13px">Nenhum tema ainda.</div>'}`}

function renderThemesAdmin(){$("main").innerHTML=`<div class="pageHead"><div><h2>Temas</h2><p>As grandes divisões do seu livro.</p></div></div><div class="card"><div class="grid2"><div><label>Novo tema</label><input id="newThemeName" type="text" placeholder="Ex.: CARDIOLOGIA"></div><div><label>Ordem</label><input id="newThemeOrder" type="text" value="${themes.length+1}"></div></div><button class="btn" style="margin-top:12px" onclick="addTheme()">+ Criar tema</button></div><div class="card"><table class="listTable"><thead><tr><th>Ordem</th><th>Tema</th><th>Capítulos</th><th></th></tr></thead><tbody>${themes.map(t=>`<tr><td>${t.order??""}</td><td><b>${esc(t.name)}</b></td><td>${chapters.filter(c=>c.themeId===t.id).length}</td><td style="text-align:right"><button class="btn secondary small" onclick="editTheme('${t.id}')">Editar</button> <button class="btn danger small" onclick="removeTheme('${t.id}')">Excluir</button></td></tr>`).join("")||'<tr><td colspan="4">Nenhum tema cadastrado.</td></tr>'}</tbody></table></div>`}
async function addTheme(){let name=$("newThemeName").value.trim();if(!name){toast("Digite o nome do tema.","err");return}themes.push({id:uid(),name,order:Number($("newThemeOrder").value)||themes.length+1,createdAt:now(),updatedAt:now()});await saveAll();renderEditorSidebar();renderThemesAdmin();toast("Tema criado.","ok")}
async function editTheme(id){let t=themes.find(x=>x.id===id);if(!t)return;let name=prompt("Nome do tema:",t.name);if(!name?.trim())return;let order=prompt("Ordem:",String(t.order||1));t.name=name.trim();t.order=Number(order)||t.order||1;t.updatedAt=now();await saveAll();renderEditorSidebar();renderThemesAdmin()}
async function removeTheme(id){if(chapters.some(c=>c.themeId===id)){alert("Este tema ainda possui capítulos. Exclua ou mova os capítulos antes.");return}if(!confirm("Excluir este tema?"))return;themes=themes.filter(t=>t.id!==id);await saveAll();renderEditorSidebar();renderThemesAdmin()}
function renderChaptersAdmin(themeId=""){let arr=themeId?chapters.filter(c=>c.themeId===themeId):chapters;$("main").innerHTML=`<div class="pageHead"><div><h2>Capítulos</h2><p>${themeId?"Capítulos deste tema":"Todos os capítulos cadastrados"}</p></div><button class="btn" onclick="newChapter('${themeId}')">+ Novo capítulo</button></div><div class="card"><table class="listTable"><thead><tr><th>Ordem</th><th>Capítulo</th><th>Tema</th><th>Fontes</th><th></th></tr></thead><tbody>${arr.map(c=>{let t=themes.find(x=>x.id===c.themeId);return `<tr><td>${c.order??""}</td><td><b>${esc(c.title)}</b></td><td>${esc(t?.name||"—")}</td><td>${(c.links||[]).length}</td><td style="text-align:right"><button class="btn secondary small" onclick="editChapter('${c.id}')">Editar</button> <button class="btn danger small" onclick="removeChapter('${c.id}')">Excluir</button></td></tr>`}).join("")||'<tr><td colspan="5">Nenhum capítulo cadastrado.</td></tr>'}</tbody></table></div>`}
function newChapter(themeId=""){editingChapterId=null;draftLinks=[];renderChapterEditor({themeId,title:"",order:chapters.filter(c=>c.themeId===themeId).length+1,html:"",links:[]})} function editChapter(id){let c=chapters.find(x=>x.id===id);if(!c)return;editingChapterId=id;draftLinks=JSON.parse(JSON.stringify(c.links||[]));renderChapterEditor(c)}
function toolbar(){return `<div class="editorToolbar"><button type="button" onclick="cmd('bold')"><b>N</b></button><button type="button" onclick="cmd('italic')"><i>I</i></button><button type="button" onclick="cmd('underline')"><u>S</u></button><select onchange="cmd('formatBlock',this.value);this.selectedIndex=0"><option>Formato</option><option value="p">Texto</option><option value="h2">Título</option><option value="h3">Subtítulo</option><option value="blockquote">Citação</option></select><button type="button" onclick="cmd('insertUnorderedList')">• Lista</button><button type="button" onclick="cmd('insertOrderedList')">1. Lista</button><button type="button" onclick="addTextLink()">🔗 Link</button><button type="button" onclick="cmd('removeFormat')">Limpar</button></div>`}
function renderChapterEditor(c){$("main").innerHTML=`<div class="pageHead"><div><h2>${editingChapterId?"Editar capítulo":"Novo capítulo"}</h2><p>Escreva sua introdução/comentário e catalogue as fontes.</p></div><button class="btn secondary" onclick="renderChaptersAdmin('${c.themeId||""}')">Voltar</button></div><div class="card"><div class="grid2"><div><label>Tema</label><select id="chapterTheme"><option value="">Selecione...</option>${themes.map(t=>`<option value="${t.id}" ${t.id===c.themeId?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div><div><label>Posição</label><input id="chapterOrder" type="text" inputmode="numeric" value="${c.order??1}"></div></div><div style="margin-top:14px"><label>Nome do capítulo</label><input id="chapterTitle" type="text" value="${esc(c.title||"")}" placeholder="Ex.: Infarto do Miocárdio 01"></div></div><div class="card"><label>Texto / descrição do capítulo</label><div style="font-size:12px;color:var(--muted);margin-bottom:8px">Cole texto do ChatGPT ou escreva aqui. Negrito, títulos e listas são preservados.</div>${toolbar()}<div id="chapterEditor" class="editor" contenteditable="true">${c.html||""}</div></div><div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div style="flex:1"><b>Fontes da internet</b><div style="font-size:12px;color:var(--muted);margin-top:4px">Adicione páginas, artigos ou PDFs.</div></div><button class="btn" onclick="addResourceRow()">+ Adicionar fonte</button></div><div id="resourceRows"></div></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-bottom:30px"><button class="btn secondary" onclick="previewChapter()">Visualizar</button><button class="btn ok" onclick="saveChapter()">💾 Salvar capítulo</button></div>`;renderResourceRows();initRichPaste($("chapterEditor"))}
function syncResources(){draftLinks.forEach(r=>{let ty=$("resType_"+r.id),ti=$("resTitle_"+r.id),u=$("resUrl_"+r.id);if(ty)r.type=ty.value;if(ti)r.title=ti.value.trim();if(u)r.url=u.value.trim()})}
function addResourceRow(){syncResources();draftLinks.push({id:uid(),type:"site",title:"",url:""});renderResourceRows()} function removeResource(id){syncResources();draftLinks=draftLinks.filter(r=>r.id!==id);renderResourceRows()}
function renderResourceRows(){let w=$("resourceRows");if(!w)return;w.innerHTML=draftLinks.length?draftLinks.map((r,i)=>`<div class="linkRow"><div><label>Tipo</label><select id="resType_${r.id}"><option value="site" ${r.type==="site"?"selected":""}>🌐 Site / artigo</option><option value="pdf" ${r.type==="pdf"?"selected":""}>📕 PDF</option></select></div><div><label>Título da fonte</label><input id="resTitle_${r.id}" type="text" value="${esc(r.title||"")}" placeholder="Ex.: Diretriz SBC 2025"></div><div><label>Link</label><input id="resUrl_${r.id}" type="url" value="${esc(r.url||"")}" placeholder="https://..."></div><button class="btn danger small" onclick="removeResource('${r.id}')">Remover</button></div>`).join(""):'<div class="empty" style="padding:28px">Nenhuma fonte adicionada.</div>'}
function cmd(c,v=null){let e=$("chapterEditor");if(!e)return;e.focus();document.execCommand(c,false,v)} function addTextLink(){let e=$("chapterEditor");e.focus();let u=prompt("Cole o endereço do link:");if(u)document.execCommand("createLink",false,u)}
function escapeHtmlText(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")} function chatGPTTextToHtml(text){let lines=String(text||"").replace(/\r\n?/g,"\n").split("\n"),out=[],list=null;let close=()=>{if(list){out.push(`</${list}>`);list=null}},inline=s=>{let x=escapeHtmlText(String(s||"").trim());x=x.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/__(.+?)__/g,"<strong>$1</strong>").replace(/(^|[\s(])\*([^*\n]+?)\*(?=$|[\s).,;:!?])/g,"$1<em>$2</em>");return x};for(let raw of lines){let s=raw.trim();if(!s){close();out.push('<p><br></p>');continue}let m;if((m=s.match(/^#{1,2}\s+(.+)$/))){close();out.push(`<h2>${inline(m[1])}</h2>`);continue}if((m=s.match(/^###\s+(.+)$/))){close();out.push(`<h3>${inline(m[1])}</h3>`);continue}if((m=s.match(/^[-•]\s+(.+)$/))){if(list!=="ul"){close();out.push("<ul>");list="ul"}out.push(`<li>${inline(m[1])}</li>`);continue}if((m=s.match(/^\d+[.)]\s+(.+)$/))){if(list!=="ol"){close();out.push("<ol>");list="ol"}out.push(`<li>${inline(m[1])}</li>`);continue}close();out.push(`<p>${inline(s)}</p>`)}close();return out.join("")}
function cleanPastedHtml(html){let box=document.createElement("div");box.innerHTML=html||"";box.querySelectorAll("script,style,iframe,object,embed,meta,link,form,input,button").forEach(n=>n.remove());box.querySelectorAll("*").forEach(el=>[...el.attributes].forEach(a=>{let n=a.name.toLowerCase();if(n.startsWith("on")||n==="id"||n==="class"||n==="contenteditable")el.removeAttribute(a.name)}));return box.innerHTML}
function initRichPaste(editor){if(!editor||editor.dataset.paste==="1")return;editor.dataset.paste="1";editor.addEventListener("paste",e=>{let cd=e.clipboardData;if(!cd)return;let plain=cd.getData("text/plain")||"",html=cd.getData("text/html")||"";if(!plain&&!html)return;e.preventDefault();document.execCommand("insertHTML",false,plain.trim()?chatGPTTextToHtml(plain):cleanPastedHtml(html))})}
async function saveChapter(){syncResources();let themeId=$("chapterTheme").value,title=$("chapterTitle").value.trim(),order=Number($("chapterOrder").value)||1,html=$("chapterEditor").innerHTML;if(!themeId){toast("Escolha o tema.","err");return}if(!title){toast("Digite o nome do capítulo.","err");return}let links=draftLinks.filter(r=>r.url).map(r=>({...r,title:r.title||r.url}));let c=editingChapterId?chapters.find(x=>x.id===editingChapterId):null;if(!c){c={id:uid(),createdAt:now()};chapters.push(c)}Object.assign(c,{themeId,title,order,html,links,updatedAt:now()});await saveAll();renderEditorSidebar();renderChaptersAdmin(themeId);toast("Capítulo salvo.","ok")}
async function removeChapter(id){if(!confirm("Excluir este capítulo?"))return;let c=chapters.find(x=>x.id===id),tid=c?.themeId||"";chapters=chapters.filter(x=>x.id!==id);await saveAll();renderEditorSidebar();renderChaptersAdmin(tid);toast("Capítulo excluído.","ok")}

function renderBackup(){$("main").innerHTML=`<div class="pageHead"><div><h2>Backup / Restaurar</h2><p>Proteja sua biblioteca e transfira para outro computador ou celular.</p></div></div><div class="grid2"><div class="card"><div style="font-size:38px">💾</div><h3>Fazer backup</h3><p style="color:var(--muted);line-height:1.5">Salva todos os temas, capítulos, textos formatados e links em um arquivo JSON.</p><button class="btn" onclick="downloadBackup()">Baixar backup completo</button></div><div class="card"><div style="font-size:38px">♻️</div><h3>Restaurar backup</h3><p style="color:var(--muted);line-height:1.5">Importe um backup do HPed Booknet. A restauração mescla itens por ID.</p><input id="restoreFile" type="file" accept=".json,application/json" style="margin:8px 0 12px;width:100%"><button class="btn secondary" onclick="restoreBackup()">Mesclar / Restaurar</button></div></div><div class="card"><b>Conteúdo atual</b><p style="color:var(--muted)">${themes.length} tema(s), ${chapters.length} capítulo(s) e ${chapters.reduce((n,c)=>n+(c.links||[]).length,0)} fonte(s).</p></div>`}
async function downloadBackup(){await saveAll();let data={app:"HPed Booknet",version:1,exportedAt:new Date().toISOString(),themes,chapters};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a"),d=new Date(),pad=n=>String(n).padStart(2,"0");a.href=url;a.download=`HPed-Booknet-Backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);toast("Backup criado.","ok")}
async function restoreBackup(){let f=$("restoreFile")?.files?.[0];if(!f){toast("Escolha um arquivo de backup.","err");return}try{let data=JSON.parse(await f.text());if(!Array.isArray(data.themes)||!Array.isArray(data.chapters))throw new Error("Formato inválido");let tm=new Map(themes.map(x=>[x.id,x]));data.themes.forEach(x=>tm.set(x.id,{...(tm.get(x.id)||{}),...x}));themes=[...tm.values()];let cm=new Map(chapters.map(x=>[x.id,x]));data.chapters.forEach(x=>cm.set(x.id,{...(cm.get(x.id)||{}),...x}));chapters=[...cm.values()];await saveAll();if(mode==="editor"){renderEditorSidebar();renderBackup()}else{renderReaderSidebar();renderReaderHome()}toast("Backup restaurado com sucesso.","ok")}catch(e){console.warn(e);toast("Backup inválido ou não pôde ser lido.","err")}}
function renderReaderSidebar(){$("sidebar").innerHTML=`<h3>HPed Booknet</h3><div class="navItem ${!selectedTheme?"active":""}" onclick="renderReaderHome()">🏠 Biblioteca</div><div class="navItem" onclick="renderReaderSearch()">🔎 Pesquisar</div><h3 style="margin-top:22px">Temas</h3>${themes.map(t=>`<div class="navItem ${selectedTheme===t.id?"active":""}" onclick="selectReaderTheme('${t.id}')">${esc(t.name)}</div>`).join("")||'<div style="padding:8px;color:#929ca6;font-size:13px">Nenhum tema.</div>'}`}
function renderReaderHome(addHistory=true){selectedTheme=null;selectedChapter=null;renderReaderSidebar();$("main").innerHTML=`<div class="pageHead"><div><h2>Minha Biblioteca</h2><p>Escolha um tema para abrir o livro ou pesquise diretamente por um capítulo.</p></div></div><div class="card"><label>Buscar na biblioteca</label><div class="searchBox" style="margin-bottom:0"><input id="librarySearchInput" type="text" placeholder="Ex.: infarto, arritmia, hipertensão..."><button class="btn" onclick="searchLibraryChapters()">Buscar</button></div><div style="font-size:12px;color:var(--muted);margin-top:8px">A busca procura no tema, nome do capítulo, texto e títulos das fontes.</div></div><div id="librarySearchResults"></div><div id="libraryThemeGrid" class="grid2">${themes.map(t=>`<div class="card themeCard" onclick="selectReaderTheme('${t.id}')"><div class="themeTitleRow"><div class="themeBookIcon">📘</div><h3>${esc(t.name)}</h3></div><p style="color:var(--muted)">${chapters.filter(c=>c.themeId===t.id).length} capítulo(s)</p><button class="btn">Abrir livro</button></div>`).join("")||'<div class="card empty">Ainda não há conteúdo.<br><br>Restaure um backup ou entre como Editor.</div>'}</div>`;setTimeout(()=>{let i=$("librarySearchInput");if(i){i.oninput=searchLibraryChapters;i.onkeydown=e=>{if(e.key==="Enter")searchLibraryChapters()}}},0);if(addHistory&&mode==="reader")setBooknetHistory("library")}
function searchLibraryChapters(){let input=$("librarySearchInput"),w=$("librarySearchResults"),grid=$("libraryThemeGrid");if(!input||!w)return;let raw=input.value.trim(),q=norm(raw);if(!q){w.innerHTML="";if(grid)grid.style.display="";return}let res=chapters.filter(c=>{let t=themes.find(x=>x.id===c.themeId);let txt=[t?.name,c.title,c.html,...(c.links||[]).flatMap(r=>[r.title,r.url,r.note])].join(" ");return norm(txt).includes(q)});if(grid)grid.style.display="none";w.innerHTML=res.length?`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><b>${res.length} capítulo(s) encontrado(s)</b><button class="btn secondary small" onclick="clearLibrarySearch()">Limpar busca</button></div></div>`+res.map(c=>{let t=themes.find(x=>x.id===c.themeId);return `<div class="card" style="cursor:pointer" onclick="openReaderChapter('${c.id}')"><span class="tag">${esc(t?.name||"Tema")}</span><h3 style="margin-bottom:6px">${esc(c.title)}</h3><p style="color:var(--muted);margin:0">${(c.links||[]).length} fonte(s) • toque para abrir o capítulo</p></div>`}).join(""):'<div class="card empty">Nenhum capítulo encontrado para <b>'+esc(raw)+'</b>.</div>'}
function clearLibrarySearch(){let i=$("librarySearchInput");if(i)i.value="";searchLibraryChapters();i?.focus()}
function selectReaderTheme(id,addHistory=true){selectedTheme=id;selectedChapter=null;renderReaderSidebar();let t=themes.find(x=>x.id===id),arr=chapters.filter(c=>c.themeId===id);$("main").innerHTML=`<div class="pageHead"><div><h2>${esc(t?.name||"Tema")}</h2><p>Capítulos deste livro.</p></div><button class="btn secondary" onclick="renderReaderHome()">← Biblioteca</button></div><div class="card">${arr.map((c,i)=>`<div style="display:flex;align-items:center;gap:15px;padding:15px 5px;border-bottom:1px solid #edf0f3;cursor:pointer" onclick="openReaderChapter('${c.id}')"><div style="width:42px;height:42px;border-radius:12px;background:#eaf1f7;display:grid;place-items:center;font-weight:800;color:#214f7a">${i+1}</div><div style="min-width:0"><b>${esc(c.title)}</b><div style="font-size:12px;color:var(--muted);margin-top:4px">${(c.links||[]).length} fonte(s)</div></div></div>`).join("")||'<div class="empty">Nenhum capítulo neste tema.</div>'}</div>`;if(addHistory&&mode==="reader")setBooknetHistory("theme",{themeId:id})}
function openReaderChapter(id,addHistory=true){let c=chapters.find(x=>x.id===id);if(!c)return;selectedTheme=c.themeId;selectedChapter=id;renderReaderSidebar();renderChapterView(c,false);if(addHistory&&mode==="reader")setBooknetHistory("chapter",{themeId:c.themeId,chapterId:id})}
function resourceHtml(r){let icon=r.type==="pdf"?"📕":"🌐",label=r.type==="pdf"?"Abrir PDF":"Abrir página";return `<a class="resourceCard" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><div class="resourceIcon">${icon}</div><div class="resourceBody"><b>${esc(r.title||label)}</b><p>${label} em nova aba</p><div class="resourceUrl">${esc(r.url)}</div></div><div style="font-size:22px;color:#789">↗</div></a>`}

function renderReaderSearch(){$("main").innerHTML=`<div class="pageHead"><div><h2>Pesquisar</h2><p>Procure em temas, capítulos e títulos das fontes.</p></div></div><div class="searchBox"><input id="searchInput" type="text" placeholder="Ex.: infarto, diretriz, anticoagulação..."><button class="btn" onclick="doSearch()">Pesquisar</button></div><div id="searchResults"></div>`;setTimeout(()=>$("searchInput").focus(),30);$("searchInput").onkeydown=e=>{if(e.key==="Enter")doSearch()}}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()} function doSearch(){let q=norm($("searchInput").value.trim()),w=$("searchResults");if(!q){w.innerHTML="";return}let res=chapters.filter(c=>{let t=themes.find(x=>x.id===c.themeId);return norm([c.title,t?.name,c.html,...(c.links||[]).flatMap(r=>[r.title,r.url])].join(" ")).includes(q)});w.innerHTML=res.length?res.map(c=>{let t=themes.find(x=>x.id===c.themeId);return `<div class="card" style="cursor:pointer" onclick="openReaderChapter('${c.id}')"><span class="tag">${esc(t?.name||"Tema")}</span><h3>${esc(c.title)}</h3><p style="color:var(--muted)">${(c.links||[]).length} fonte(s)</p></div>`}).join(""):'<div class="card empty">Nada encontrado.</div>'}
function renderReaderRestore(){$("main").innerHTML=`<div class="pageHead"><div><h2>Restaurar biblioteca</h2><p>Importe um backup do HPed Booknet neste aparelho.</p></div></div><div class="card" style="max-width:720px"><div style="font-size:42px">♻️</div><h3>Carregar backup</h3><input id="restoreFile" type="file" accept=".json,application/json" style="margin:10px 0 14px;width:100%"><button class="btn" onclick="restoreBackup()">Mesclar / Restaurar</button></div>`}


function incomingParams(){const p=new URLSearchParams(location.search);if(p.get("booknet_add")!=="1")return null;return {url:p.get("url")||"",title:p.get("title")||"",type:p.get("type")||((p.get("url")||"").toLowerCase().includes(".pdf")?"pdf":"site")}}
function hasIncomingSource(){const x=incomingParams();return !!(x&&x.url)}
function editorSessionActive(){try{return sessionStorage.getItem(EDITOR_SESSION_KEY)==="1"}catch(e){return false}}
async function resumeEditorFromExtension(){
 if(!hasIncomingSource()||!editorSessionActive())return false;
 mode="editor";
 try{history.replaceState({hpedBooknet:true,mode:"editor",view:"editor"},"",location.href)}catch(e){}
 await openApp();
 return true;
}
function clearIncomingParams(){try{const u=new URL(location.href);["booknet_add","url","title","type"].forEach(k=>u.searchParams.delete(k));history.replaceState(history.state||{},"",u.toString())}catch(e){}}
function renderBrowserIntegration(){
 const here=(location.protocol==="http:"||location.protocol==="https:")?location.origin+location.pathname:"(publique o Booknet em HTTPS para usar a extensão em todos os aparelhos)";
 $("main").innerHTML=`<div class="pageHead"><div><h2>Chrome / Edge</h2><p>Capture páginas e PDFs da internet e envie direto para o HPed Booknet.</p></div></div><div class="extCard"><span class="extBadge">🧩 HPed Booknet Capture</span><h3>Como funciona</h3><p style="color:var(--muted);line-height:1.6">Com a extensão instalada, abra qualquer artigo ou PDF, clique no ícone do HPed Booknet e escolha <b>Enviar ao Booknet</b>. O Booknet abre com o título e o link já preenchidos; você só escolhe o tema e o capítulo.</p><label>Endereço deste Booknet</label><div class="extUrl">${esc(here)}</div><div class="extActions"><button class="btn secondary" onclick="copyBooknetAddress()">Copiar endereço</button></div></div><div class="card"><b>Instalação manual da extensão</b><p style="color:var(--muted);line-height:1.75"><b>1.</b> Solicite o arquivo <b>HPed-Booknet-Capture-Extension.zip</b> pelo e-mail <b>rmassucatto@gmail.com</b>.<br><b>2.</b> Depois de receber, salve o ZIP no computador e escolha <b>Extrair tudo</b> / descompactar.<br><b>3.</b> No Chrome abra <b>chrome://extensions</b> ou no Edge <b>edge://extensions</b>.<br><b>4.</b> Ative <b>Modo do desenvolvedor</b>.<br><b>5.</b> Clique em <b>Carregar sem compactação</b> e selecione a <b>pasta descompactada</b> da extensão — não selecione o arquivo ZIP.<br><b>6.</b> Abra as opções da extensão e cole o endereço do seu HPed Booknet.</p><div class="extActions"><a class="btn" style="text-decoration:none;display:inline-block" href="mailto:rmassucatto@gmail.com?subject=Solicita%C3%A7%C3%A3o%20HPed%20Booknet%20Capture&body=Ol%C3%A1%2C%20gostaria%20de%20solicitar%20o%20arquivo%20ZIP%20da%20extens%C3%A3o%20HPed%20Booknet%20Capture.">✉️ Solicitar extensão por e-mail</a></div><p style="color:var(--muted);font-size:13px;margin-top:16px">Por segurança, Chrome e Edge não permitem que uma página HTML instale silenciosamente uma extensão. Quando a extensão for publicada na Chrome Web Store, este painel poderá receber um botão oficial <b>Adicionar ao Chrome</b>.</p></div>`
}
function copyBooknetAddress(){const a=(location.protocol==="http:"||location.protocol==="https:")?location.origin+location.pathname:location.href.split("?")[0];navigator.clipboard?.writeText(a).then(()=>toast("Endereço copiado.","ok")).catch(()=>prompt("Copie o endereço:",a))}
function renderIncomingSource(){enqueueIncomingSource();renderEditorSidebar();renderCaptureQueue()}

function renderCaptureQueue(){
 const q=loadCaptureQueue();
 $("main").innerHTML=`<div class="pageHead"><div><h2>Capturas pendentes</h2><p>Envie vários sites ou PDFs pela extensão e finalize um por um quando quiser.</p></div>${q.length?`<button class="btn danger small" onclick="clearCaptureQueue()">Limpar fila</button>`:""}</div>
 <div class="card"><b>${q.length} item(ns) aguardando</b><p style="color:var(--muted);margin-bottom:0">Cada captura fica guardada até você finalizar ou excluir.</p></div>
 ${q.length?q.map((x,i)=>`<div class="extCard"><span class="extBadge">${x.type==="pdf"?"📕 PDF":"🌐 Página"} • ${i+1}</span><h3 style="margin:10px 0 6px">${esc(x.title||"Fonte sem título")}</h3><div class="extUrl">${esc(x.url)}</div><div class="extActions"><button class="btn ok" onclick="processCaptureItem('${x.id}')">Finalizar</button><button class="btn danger small" onclick="removeCaptureFromQueue('${x.id}')">Excluir</button></div></div>`).join(""):`<div class="card empty">Nenhuma captura pendente.<br><br>Continue navegando e use a extensão. Os próximos itens aparecerão aqui.</div>`}`;
}

function processCaptureItem(id){
 const x=loadCaptureQueue().find(i=>i.id===id); if(!x)return;
 window.__captureEditingId=id;
 $("main").innerHTML=`<div class="pageHead"><div><h2>Finalizar captura</h2><p>Escolha onde guardar esta fonte.</p></div><button class="btn secondary" onclick="renderCaptureQueue()">← Voltar à fila</button></div>
 <div class="extCard"><span class="extBadge">${x.type==="pdf"?"📕 PDF":"🌐 Página"}</span><h3 style="margin:10px 0 6px">${esc(x.title||"Fonte sem título")}</h3><div class="extUrl">${esc(x.url)}</div></div>
 <div class="card"><div class="extRow"><div><label>Tema</label><select id="incomingTheme" onchange="refreshIncomingChapters()"><option value="">Selecione...</option>${themes.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></div><div><label>Capítulo</label><select id="incomingChapter"><option value="">Escolha primeiro o tema</option></select></div></div>
 <div style="margin-top:14px"><label>Título da fonte</label><input id="incomingTitle" type="text" value="${esc(x.title||x.url)}"></div>
 <div style="margin-top:14px"><label>Tipo</label><select id="incomingType"><option value="site" ${x.type!=="pdf"?"selected":""}>🌐 Site / artigo</option><option value="pdf" ${x.type==="pdf"?"selected":""}>📕 PDF</option></select></div>
 <div class="extActions"><button class="btn ok" onclick="saveQueuedCapture()">✓ Adicionar ao capítulo</button><button class="btn secondary" onclick="newChapterFromQueuedCapture()">+ Criar novo capítulo</button></div></div>`;
}

async function saveQueuedCapture(){
 const id=window.__captureEditingId, x=loadCaptureQueue().find(i=>i.id===id), cid=$("incomingChapter")?.value;
 if(!x||!cid){toast("Escolha o tema e o capítulo.","err");return}
 const c=chapters.find(z=>z.id===cid); if(!c)return;
 c.links=Array.isArray(c.links)?c.links:[];
 c.links.push({id:uid(),type:$("incomingType")?.value||x.type,title:$("incomingTitle")?.value.trim()||x.title||x.url,url:x.url});
 c.updatedAt=now(); await saveAll();
 saveCaptureQueue(loadCaptureQueue().filter(i=>i.id!==id)); window.__captureEditingId=null;
 renderEditorSidebar(); renderCaptureQueue(); toast("Fonte adicionada. Próxima captura pronta.","ok");
}

function newChapterFromQueuedCapture(){
 const id=window.__captureEditingId, x=loadCaptureQueue().find(i=>i.id===id), tid=$("incomingTheme")?.value||"";
 if(!x||!tid){toast("Escolha primeiro o tema.","err");return}
 const title=$("incomingTitle")?.value.trim()||x.title||"Novo capítulo", type=$("incomingType")?.value||x.type;
 saveCaptureQueue(loadCaptureQueue().filter(i=>i.id!==id)); window.__captureEditingId=null;
 editingChapterId=null; draftLinks=[{id:uid(),type,title,url:x.url}];
 renderEditorSidebar(); renderChapterEditor({themeId:tid,title:"",order:chapters.filter(c=>c.themeId===tid).length+1,html:"",links:draftLinks});
}

function refreshIncomingChapters(){const tid=$("incomingTheme")?.value||"";const sel=$("incomingChapter");if(!sel)return;const arr=chapters.filter(c=>c.themeId===tid);sel.innerHTML='<option value="">Selecione...</option>'+arr.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("")}
async function saveIncomingSource(){const x=incomingParams();const cid=$("incomingChapter")?.value;if(!x||!cid){toast("Escolha o tema e o capítulo.","err");return}const c=chapters.find(z=>z.id===cid);if(!c)return;c.links=Array.isArray(c.links)?c.links:[];c.links.push({id:uid(),type:$("incomingType")?.value||x.type,title:$("incomingTitle")?.value.trim()||x.title||x.url,url:x.url});c.updatedAt=now();await saveAll();clearIncomingParams();renderChaptersAdmin(c.themeId);toast("Fonte adicionada ao capítulo.","ok")}
function newChapterFromIncoming(){const x=incomingParams();const tid=$("incomingTheme")?.value||"";if(!tid){toast("Escolha primeiro o tema.","err");return}const title=$("incomingTitle")?.value.trim()||x.title||"Novo capítulo";clearIncomingParams();editingChapterId=null;draftLinks=[{id:uid(),type:$("incomingType")?.value||x.type,title,url:x.url}];renderChapterEditor({themeId:tid,title:"",order:chapters.filter(c=>c.themeId===tid).length+1,html:"",links:draftLinks})}
function cancelIncomingSource(){renderCaptureQueue()}

try{if(!history.state?.hpedBooknet)history.replaceState({hpedBooknet:true,view:"entry"},"",location.href)}catch(e){}
// Se a extensão reutilizar uma aba do Booknet que já estava autenticada como Editor,
 // entra direto em "Adicionar fonte do navegador", sem voltar para a tela inicial.
 setTimeout(()=>{resumeEditorFromExtension().catch(e=>console.warn("Retomar Editor:",e))},0);

window.addEventListener("popstate",e=>{
 const st=e.state;
 if(!st||!st.hpedBooknet){showEntryFromHistory();return}
 if(st.view==="entry"){showEntryFromHistory();return}
 if(st.mode==="reader"||st.view==="library"||st.view==="theme"||st.view==="chapter"){
  mode="reader";$("entry").classList.add("hidden");$("app").classList.remove("hidden");$("modeBadge").textContent="LEITOR";
  if(st.view==="chapter"&&st.chapterId){openReaderChapter(st.chapterId,false);return}
  if(st.view==="theme"&&st.themeId){selectReaderTheme(st.themeId,false);return}
  renderReaderHome(false);return;
 }
 if(st.view==="editor"){mode="editor";$("entry").classList.add("hidden");$("app").classList.remove("hidden");$("modeBadge").textContent="EDITOR";renderEditorSidebar();renderEditorHome();return}
});
</script>
</body></html>
